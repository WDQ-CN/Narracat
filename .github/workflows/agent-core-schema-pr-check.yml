name: Agent Core Schema PR Downstream Impact Check

# 当 PR 改动 agent-core/narracat/schemas/*.json 时强制 PR description 含"下游影响"评估。
# 背景：agent-core/narracat/schemas/*.json 是引擎对外的数据契约，用户项目目录里已经落盘了
# 按旧 schema 写出的文件，schema 变动可能是 silent breaking change。
# 缺失关键字 → workflow 失败 → review 阻塞。模板见 .github/PULL_REQUEST_TEMPLATE.md。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'agent-core/narracat/schemas/**.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-downstream-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for downstream impact assessment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 匹配关键字（大小写不敏感，中英文兼容）
          # 中文: "下游影响" / "下游兼容" / "客户端影响" / "兼容性影响"
          # 英文: "downstream impact" / "downstream compat" / "client impact" / "breaking change"
          PATTERN='下游影响|下游兼容|客户端影响|兼容性影响|downstream[[:space:]]+impact|downstream[[:space:]]+compat|client[[:space:]]+impact|breaking[[:space:]]+change'

          if [ -z "${PR_BODY}" ]; then
            echo "::error::PR #${PR_NUMBER} description 为空。改动 schemas/*.json 必须填写'下游影响'评估。"
            echo "::error::请参考 .github/PULL_REQUEST_TEMPLATE.md 的 schema 改动 section。"
            exit 1
          fi

          if echo "${PR_BODY}" | grep -iE "${PATTERN}" > /dev/null; then
            echo "PR description 含'下游影响'评估关键字，通过。"
            echo "${PR_BODY}" | grep -iE "${PATTERN}" | head -3
          else
            echo "::error::PR #${PR_NUMBER} 改动了 schemas/*.json 但 description 未含'下游影响'评估。"
            echo "::error::请在 PR description 中加入下游影响章节（关键字之一：下游影响 / 下游兼容 / 客户端影响 / 兼容性影响 / downstream impact / breaking change）。"
            echo "::error::模板见 .github/PULL_REQUEST_TEMPLATE.md。"
            exit 1
          fi
